<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 290" role="img" aria-label="Grundriss: Sitzgruppe mit Tisch im Heck, Kleiderschrank an der Längsseite, Bad unten links, Küche gegenüber, Bett 180 × 200 cm im Bug">
  <title>Grundriss mit Bad an der Seite und Bett 180 × 200 cm</title>
  <defs>
    <pattern id="schrankHatchH" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#dfceb2"/>
      <line x1="5" y1="0" x2="5" y2="10" stroke="#706e5c" stroke-width="1.8"/>
    </pattern>
  </defs>

  <!-- Deichsel -->
  <path d="M648,112 L742,133 V152 L648,173 Z" fill="#706e5c" fill-opacity="0.28" stroke="#403f2b" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="742" y1="142" x2="770" y2="142" stroke="#403f2b" stroke-width="4" stroke-linecap="round"/>
  <path d="M762,134 q12,8 0,16" fill="none" stroke="#403f2b" stroke-width="3" stroke-linecap="round"/>

  <!-- Aufbau -->
  <rect x="10" y="12" width="644" height="262" rx="26" fill="#fefaf0" stroke="#403f2b" stroke-width="5"/>

  <!-- Sitzgruppe im Heck: zwei Bänke mit Tisch -->
  <rect x="24" y="28" width="68" height="108" rx="8" fill="#62979f" fill-opacity="0.5" stroke="#403f2b" stroke-width="2.5"/>
  <rect x="98" y="30" width="72" height="104" rx="10" fill="#f7f0dd" stroke="#403f2b" stroke-width="2.5"/>
  <rect x="176" y="28" width="70" height="108" rx="8" fill="#62979f" fill-opacity="0.5" stroke="#403f2b" stroke-width="2.5"/>

  <!-- Kleiderschrank an der oberen Längsseite -->
  <rect x="252" y="26" width="104" height="46" fill="url(#schrankHatchH)" stroke="#403f2b" stroke-width="2.5"/>

  <!-- Bad unten links -->
  <path d="M24,158 H140 Q146,158 146,164 V262 H24 Z" fill="#62979f" fill-opacity="0.28" stroke="#403f2b" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M46,252 V226 Q46,206 65,206 Q84,206 84,226 V252 Z" fill="#fefaf0" stroke="#403f2b" stroke-width="2.2" stroke-linejoin="round"/>
  <rect x="52" y="240" width="26" height="10" rx="4" fill="#fefaf0" stroke="#403f2b" stroke-width="1.8"/>
  <circle cx="114" cy="234" r="18" fill="#fefaf0" stroke="#403f2b" stroke-width="2.2"/>
  <circle cx="114" cy="234" r="3" fill="#403f2b"/>
  <line x1="147" y1="164" x2="182" y2="184" stroke="#403f2b" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Küche unten -->
  <rect x="218" y="212" width="146" height="48" rx="3" fill="#f7f0dd" stroke="#403f2b" stroke-width="2.5"/>
  <rect x="232" y="220" width="46" height="32" rx="3" fill="#fefaf0" stroke="#403f2b" stroke-width="2"/>
  <circle cx="255" cy="244" r="3" fill="#403f2b"/>
  <rect x="292" y="220" width="58" height="32" rx="5" fill="#fefaf0" stroke="#403f2b" stroke-width="2"/>
  <circle cx="307" cy="236" r="7" fill="none" stroke="#403f2b" stroke-width="2"/>
  <circle cx="307" cy="236" r="2.5" fill="#403f2b"/>
  <circle cx="335" cy="236" r="7" fill="none" stroke="#403f2b" stroke-width="2"/>
  <circle cx="335" cy="236" r="2.5" fill="#403f2b"/>

  <!-- Bett 180 x 200 cm, Kopfende zur Deichsel -->
  <rect x="368" y="26" width="270" height="236" rx="4" fill="#dfceb2" stroke="#403f2b" stroke-width="2.5"/>
  <path d="M566,66 Q590,78 614,66 Q601,102 614,138 Q590,126 566,138 Q579,102 566,66 Z"
        fill="#706e5c" fill-opacity="0.55" stroke="#403f2b" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M566,150 Q590,162 614,150 Q601,186 614,222 Q590,210 566,222 Q579,186 566,150 Z"
        fill="#706e5c" fill-opacity="0.55" stroke="#403f2b" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M548,28 Q532,144 548,260" fill="none" stroke="#403f2b" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Fenster -->
  <g fill="#fefaf0" stroke="#403f2b" stroke-width="2.5">
    <rect x="54" y="4" width="108" height="16"/>
    <rect x="444" y="4" width="106" height="16"/>
    <rect x="56" y="266" width="62" height="16"/>
    <rect x="448" y="266" width="100" height="16"/>
    <rect x="2" y="66" width="16" height="70"/>
    <rect x="646" y="70" width="16" height="130"/>
  </g>

  <!-- Eingangstür -->
  <rect x="160" y="270" width="56" height="8" fill="#fefaf0"/>
  <line x1="216" y1="272" x2="160" y2="288" stroke="#403f2b" stroke-width="3" stroke-linecap="round"/>
</svg>
