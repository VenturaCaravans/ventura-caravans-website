<div class="modal-overlay" id="modal-overlay">
  <div class="modal-box">
    <button type="button" class="modal-close" id="modal-close" aria-label="Schließen">&#10005;</button>
    <div class="modal-img" id="modal-gallery">
      <button type="button" class="gallery-arrow prev" id="gallery-prev" aria-label="Vorheriges Bild">&#10094;</button>
      <img id="modal-img" src="" alt="">
      <button type="button" class="gallery-arrow next" id="gallery-next" aria-label="Nächstes Bild">&#10095;</button>
      <div class="gallery-dots" id="gallery-dots"></div>
    </div>
    <div class="modal-body">
      <h3 id="modal-title"></h3>
      <div class="modal-price" id="modal-price"></div>
      <ul class="modal-highlights" id="modal-highlights"></ul>
      <p class="modal-desc" id="modal-desc"></p>
      <button type="button" class="modal-select-btn" id="modal-select-btn"></button>
    </div>
  </div>
</div>
